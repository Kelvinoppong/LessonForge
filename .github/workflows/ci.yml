name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  content-ai:
    name: content-ai service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/content-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/content-ai/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q
